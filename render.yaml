services:
  # See https://render.com/docs/blueprint-spec for more info on render blueprints
  - type: web
    name: omm_certificates_mvp
    env: python
    plan: free
    # A requirements.txt file must exist
    buildCommand: pip install -r requirements.txt
    # A src/dash_app.py file must exist and contain `server=app.server`
    startCommand: gunicorn --chdir src dash_app:server
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
